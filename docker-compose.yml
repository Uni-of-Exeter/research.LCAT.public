services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lcat}
      POSTGRES_PASSWORD: ${DB_PASS:-lcat}
      POSTGRES_DB: ${DB_DATABASE:-lcat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lcat} -d ${DB_DATABASE:-lcat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-lcat}
      DB_PASS: ${DB_PASS:-lcat}
      DB_HOST: ${DB_HOST:-db:5432}
      DB_DATABASE: ${DB_DATABASE:-lcat}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: