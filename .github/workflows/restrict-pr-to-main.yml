name: Restrict PRs to main
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if source branch is not dev
        if: github.head_ref != 'dev'
        run: |
          echo "PRs to main must come from dev. Source branch: ${{ github.head_ref }}"
          exit 1