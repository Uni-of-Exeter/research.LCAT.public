version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/data"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"